<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hermes Pixel Office</title>
<style>
  :root{
    --bg:#0d0b14; --panel:#171326; --line:#2a2340; --ink:#e8e2ff; --dim:#8b83ad;
    --work:#5ee6a8; --active:#6cc0ff; --idle:#8b83ad;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--ink);
    font:14px/1.45 ui-monospace,"Cascadia Mono",Consolas,monospace;
    display:flex; flex-direction:column; align-items:center; gap:10px; padding:14px;
  }
  header{width:100%;max-width:1120px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  h1{font-size:15px;margin:0;letter-spacing:.5px}
  .pill{border:1px solid var(--line);border-radius:999px;padding:3px 11px;color:var(--dim);font-size:12px}
  .pill b{color:var(--ink)}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:middle}
  .stage{position:relative;width:100%;max-width:1120px}
  canvas{
    width:100%;height:auto;display:block;border:1px solid var(--line);border-radius:12px;
    background:#141020;
  }
  .roster{width:100%;max-width:1120px;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
  .card{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:9px 11px}
  .card .top{display:flex;align-items:center;gap:8px;margin-bottom:5px}
  .card .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .card .meta{color:var(--dim);font-size:12px}
  .card .row{display:flex;justify-content:space-between;color:var(--dim);font-size:12px;margin-top:2px}
  .swatch{width:12px;height:12px;border-radius:3px;flex:0 0 auto}
  .err{color:#ff8080}
  .tabs{display:flex;gap:6px;width:100%;max-width:1120px}
  .tab{border:1px solid var(--line);background:var(--panel);color:var(--dim);
       padding:5px 12px;border-radius:8px;font:inherit;font-size:12px;text-decoration:none}
  .tab.on{border-color:#4a5a90;background:#1d2440;color:var(--ink)}
  footer{color:var(--dim);font-size:11px;text-align:center;max-width:1120px}
</style>
</head>
<body>
<header>
  <h1>HERMES PIXEL OFFICE</h1>
  <span class="pill">agents <b id="n-all">0</b></span>
  <span class="pill"><span class="dot" style="background:var(--work)"></span>working <b id="n-work">0</b></span>
  <span class="pill">refresh <b id="n-tick">-</b></span>
  <span class="pill" id="p-db">connecting…</span>
</header>

<div class="tabs">
  <span class="tab on">Pixel Office (Hermes)</span>
  <a class="tab" href="/kantor">Kantor Berita Finance →</a>
</div>

<div class="stage"><canvas id="c" width="1120" height="720"></canvas></div>
<div class="roster" id="roster"></div>
<footer>
  Tiap karakter = satu sesi Hermes asli (dibaca dari state.db, read-only). Working duduk di meja,
  aktif nongkrong di lounge, idle muter di kantin dan ruang game.
</footer>

<script>
(() => {
  "use strict";
  const cvs = document.getElementById("c");
  const ctx = cvs.getContext("2d");
  ctx.imageSmoothingEnabled = false;
  // Render at 2x device resolution: sprites keep crisp integer pixels, text stays sharp.
  const SCALE = 2;
  const W = cvs.width / SCALE, H = cvs.height / SCALE;
  ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0);

  // ---------- pixel helpers ----------
  function px(x, y, w, h, col) { ctx.fillStyle = col; ctx.fillRect(x|0, y|0, w|0, h|0); }

  function rectOutline(x, y, w, h, col) {
    px(x, y, w, 1, col); px(x, y + h - 1, w, 1, col);
    px(x, y, 1, h, col); px(x + w - 1, y, 1, h, col);
  }

  // ---------- office layout (pixel coords) ----------
  const ROOMS = {
    desk:     { x: 20,  y: 46,  w: 300, h: 130, floor: "#3b3350", name: "WORK DESKS" },
    board:    { x: 332, y: 46,  w: 208, h: 74,  floor: "#37304b", name: "BOARDROOM" },
    kitchen:  { x: 332, y: 130, w: 208, h: 46,  floor: "#3d3446", name: "KITCHEN" },
    lounge:   { x: 20,  y: 186, w: 250, h: 158, floor: "#3a3350", name: "LOUNGE" },
    games:    { x: 282, y: 186, w: 258, h: 158, floor: "#37314e", name: "GAMES" },
  };
  const DOORS = [ // little gaps between rooms
    { x: 320, y: 100, w: 12, h: 14 },
    { x: 270, y: 240, w: 12, h: 16 },
  ];

  // desk slots inside the desk room
  const DESKS = [];
  for (let i = 0; i < 6; i++) {
    DESKS.push({ x: 44 + (i % 3) * 92, y: 82 + Math.floor(i / 3) * 54 });
  }
  const LOUNGE_SPOTS = [
    { x: 52, y: 236 }, { x: 120, y: 236 }, { x: 188, y: 236 },
    { x: 52, y: 300 }, { x: 120, y: 300 }, { x: 188, y: 300 },
  ];
  const GAME_SPOTS = [
    { x: 320, y: 232 }, { x: 396, y: 232 }, { x: 472, y: 232 },
    { x: 320, y: 306 }, { x: 396, y: 306 }, { x: 472, y: 306 },
  ];
  const KITCHEN_SPOTS = [{ x: 360, y: 152 }, { x: 420, y: 152 }, { x: 480, y: 152 }];
  const BOARD_SPOTS = [{ x: 360, y: 96 }, { x: 430, y: 96 }, { x: 500, y: 96 }];

  // ---------- sprites ----------
  // Each character: 6x10 px body, drawn from a palette so every agent looks different.
  const PALETTES = [
    { hair:"#2b2340", skin:"#f2c9a0", shirt:"#6cc0ff", pants:"#2f2a4d" },
    { hair:"#4a2b2b", skin:"#e8b98c", shirt:"#5ee6a8", pants:"#33405c" },
    { hair:"#1f2b3d", skin:"#f7d6b3", shirt:"#ffb86c", pants:"#3a2f4a" },
    { hair:"#3b2a52", skin:"#e6b48a", shirt:"#ff7ba8", pants:"#2b3350" },
    { hair:"#243b32", skin:"#f0c79e", shirt:"#c792ea", pants:"#332e50" },
    { hair:"#402020", skin:"#ffd9b0", shirt:"#7bd88f", pants:"#303a55" },
    { hair:"#2a2a3a", skin:"#eabf96", shirt:"#ffd166", pants:"#2c2a4a" },
    { hair:"#33243f", skin:"#f4cda6", shirt:"#8ad1ff", pants:"#35314f" },
  ];

  function drawChar(x, y, pal, opts = {}) {
    const bob = opts.bob ? 1 : 0;
    y -= bob;
    px(x + 1, y,     4, 3, pal.hair);      // hair
    px(x + 1, y + 3, 4, 3, pal.skin);      // face
    px(x + 0, y + 3, 1, 3, pal.hair);      // side hair
    px(x + 5, y + 3, 1, 3, pal.hair);
    px(x + 2, y + 4, 1, 1, "#20182c");     // eye
    px(x + 4, y + 4, 1, 1, "#20182c");     // eye
    px(x + 1, y + 6, 4, 3, pal.shirt);     // torso
    px(x + 0, y + 6, 1, 3, pal.shirt);
    px(x + 5, y + 6, 1, 3, pal.shirt);
    px(x + 1, y + 9, 2, 1, pal.pants);     // legs
    px(x + 3, y + 9, 2, 1, pal.pants);
  }

  function drawDesk(x, y, occupied) {
    px(x, y + 12, 26, 3, "#5a4a7a");       // desk top
    px(x + 2, y + 15, 3, 8, "#4a3d66");    // leg
    px(x + 21, y + 15, 3, 8, "#4a3d66");   // leg
    px(x + 5, y + 4, 14, 8, "#1b1730");    // monitor
    px(x + 6, y + 5, 12, 6, occupied ? "#5ee6a8" : "#2b3a4d");
    px(x + 10, y + 12, 4, 1, "#4a3d66");   // stand
  }

  function drawPlant(x, y) {
    px(x + 2, y + 6, 5, 4, "#6b4a35");
    px(x + 0, y + 0, 9, 6, "#3f9a63");
    px(x + 2, y - 2, 5, 3, "#4fbf78");
  }

  function drawSofa(x, y) {
    px(x, y, 30, 12, "#6a4f8f");
    px(x, y, 30, 4, "#7d5ea6");
    px(x + 2, y + 8, 26, 4, "#5b4379");
  }

  function drawTable(x, y) {
    px(x, y, 34, 4, "#6b5a8f");
    px(x + 2, y + 4, 3, 7, "#54466f");
    px(x + 29, y + 4, 3, 7, "#54466f");
  }

  function drawArcade(x, y) {
    px(x, y, 16, 22, "#241d38");
    px(x + 2, y + 2, 12, 9, "#ff7ba8");
    px(x + 3, y + 3, 10, 7, "#3a2b55");
    px(x + 5, y + 13, 2, 2, "#5ee6a8");
    px(x + 9, y + 13, 2, 2, "#6cc0ff");
  }

  function drawCoffee(x, y) {
    px(x, y, 14, 10, "#3a3350");
    px(x + 2, y + 2, 10, 6, "#7a5a3f");
    px(x + 3, y + 1, 3, 1, "#d8d2ee"); // steam
  }

  // ---------- world state ----------
  let AGENTS = [];
  let t = 0;

  function seedFor(id) {
    let h = 0;
    for (let i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) >>> 0;
    return h;
  }

  // Give each agent a stable room + slot + palette.
  function assign() {
    const used = { desk: 0, lounge: 0, games: 0, kitchen: 0, board: 0 };
    AGENTS.forEach((a, i) => {
      const s = seedFor(a.id);
      a.pal = PALETTES[s % PALETTES.length];
      a.bobPhase = (s % 100) / 100 * Math.PI * 2;
      let room;
      if (a.status === "working") room = "desk";
      else if (a.status === "active") room = "lounge";
      else room = (s % 3 === 0) ? "games" : (s % 3 === 1 ? "kitchen" : "board");
      a.room = room;
      const idx = used[room]++;
      let spot;
      if (room === "desk") spot = DESKS[idx % DESKS.length];
      else if (room === "lounge") spot = LOUNGE_SPOTS[idx % LOUNGE_SPOTS.length];
      else if (room === "games") spot = GAME_SPOTS[idx % GAME_SPOTS.length];
      else if (room === "kitchen") spot = KITCHEN_SPOTS[idx % KITCHEN_SPOTS.length];
      else spot = BOARD_SPOTS[idx % BOARD_SPOTS.length];
      a.spot = spot;
      a.x = spot.x; a.y = spot.y;
      a.tx = spot.x; a.ty = spot.y;
      a.face = 1;
    });
  }

  // ---------- render ----------
  function drawRoom(r, labelCol) {
    px(r.x, r.y, r.w, r.h, r.floor);
    rectOutline(r.x, r.y, r.w, r.h, "#4a3f6b");
    // checkerboard floor
    for (let yy = r.y + 4; yy < r.y + r.h - 4; yy += 8) {
      for (let xx = r.x + 4; xx < r.x + r.w - 4; xx += 8) {
        if (((xx + yy) / 8) % 2 === 0) px(xx, yy, 8, 8, "rgba(255,255,255,0.03)");
      }
    }
    ctx.fillStyle = labelCol;
    ctx.font = "7px ui-monospace,monospace";
    ctx.fillText(r.name, r.x + 5, r.y + 10);
  }

  function render() {
    t++;
    px(0, 0, W, H, "#141020");

    // title bar
    px(0, 0, W, 34, "#1b1630");
    ctx.fillStyle = "#e8e2ff";
    ctx.font = "bold 12px ui-monospace,monospace";
    ctx.fillText("HERMES PIXEL OFFICE", 20, 21);
    ctx.fillStyle = "#8b83ad";
    ctx.font = "9px ui-monospace,monospace";
    const working = AGENTS.filter(a => a.status === "working").length;
    ctx.fillText(`${AGENTS.length} agents · ${working} working`, 210, 21);
    px(0, 33, W, 1, "#2a2340");

    // rooms
    drawRoom(ROOMS.desk, "#9c8fd0");
    drawRoom(ROOMS.board, "#9c8fd0");
    drawRoom(ROOMS.kitchen, "#9c8fd0");
    drawRoom(ROOMS.lounge, "#9c8fd0");
    drawRoom(ROOMS.games, "#9c8fd0");
    DOORS.forEach(d => px(d.x, d.y, d.w, d.h, "#141020"));

    // furniture
    DESKS.forEach((d, i) => drawDesk(d.x - 4, d.y - 4, i < AGENTS.filter(a => a.room === "desk").length));
    drawSofa(36, 214); drawSofa(140, 214);
    drawTable(330, 200); drawTable(410, 200);
    drawArcade(300, 258); drawArcade(448, 258);
    drawArcade(300, 316); drawArcade(448, 316);
    drawCoffee(350, 140); drawCoffee(470, 140);
    drawPlant(296, 60); drawPlant(524, 60); drawPlant(36, 330); drawPlant(524, 330);

    // agents
    const sorted = [...AGENTS].sort((a, b) => a.y - b.y);
    for (const a of sorted) {
      const bob = (a.status === "working") && (Math.floor(t / 12 + a.bobPhase) % 2 === 0);
      // working: sit at desk (draw char behind desk)
      if (a.room === "desk") {
        drawChar(a.x, a.y - 6, a.pal, { bob });
        px(a.x - 2, a.y + 2, 10, 2, "#5a4a7a"); // desk edge over legs
      } else {
        drawChar(a.x, a.y, a.pal, { bob: false });
      }
      // status ring
      const col = a.status === "working" ? "#5ee6a8" : (a.status === "active" ? "#6cc0ff" : "#8b83ad");
      if (a.status === "working") {
        const blink = Math.floor(t / 20) % 2 === 0;
        if (blink) px(a.x + 2, a.y - 12, 2, 2, col);
      }
      // name tag
      ctx.fillStyle = "rgba(13,11,20,0.75)";
      const label = a.name.slice(0, 14);
      ctx.font = "7px ui-monospace,monospace";
      const w = ctx.measureText(label).width + 6;
      px(a.x + 3 - w / 2 + 3, a.y - 21, w, 9, "rgba(13,11,20,0.75)");
      ctx.fillStyle = col;
      ctx.fillText(label, a.x + 3 - w / 2 + 6, a.y - 14);
    }
  }

  // ---------- roster ----------
  function fmt(n) { return n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : n >= 1e3 ? (n / 1e3).toFixed(1) + "k" : String(n); }
  function ago(s) {
    if (s < 60) return Math.round(s) + "s lalu";
    if (s < 3600) return Math.round(s / 60) + "m lalu";
    if (s < 86400) return Math.round(s / 3600) + "j lalu";
    return Math.round(s / 86400) + "h lalu";
  }

  function renderRoster() {
    const el = document.getElementById("roster");
    el.innerHTML = "";
    const order = { working: 0, active: 1, idle: 2 };
    [...AGENTS].sort((a, b) => (order[a.status] - order[b.status]) || (a.age_s - b.age_s))
      .forEach(a => {
        const col = a.status === "working" ? "var(--work)" : (a.status === "active" ? "var(--active)" : "var(--idle)");
        const d = document.createElement("div");
        d.className = "card";
        d.innerHTML =
          `<div class="top">
             <span class="swatch" style="background:${a.pal.shirt}"></span>
             <span class="nm">${esc(a.name)}</span>
           </div>
           <div class="meta"><span class="dot" style="background:${col}"></span>${a.status} · ${esc(a.source)} · ${esc(a.model)}</div>
           ${a.tool ? `<div class="row"><span>tool terakhir</span><span>${esc(a.tool)}</span></div>` : ""}
           <div class="row"><span>pesan</span><span>${a.messages}</span></div>
           <div class="row"><span>tool call</span><span>${a.tool_calls}</span></div>
           <div class="row"><span>token in/out</span><span>${fmt(a.tokens_in)} / ${fmt(a.tokens_out)}</span></div>
           <div class="row"><span>aktivitas</span><span>${a.ended ? "selesai" : ago(a.age_s)}</span></div>`;
        el.appendChild(d);
      });
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  // ---------- loop ----------
  async function tick() {
    try {
      const r = await fetch("/api/state", { cache: "no-store" });
      const d = await r.json();
      if (!d.ok) {
        document.getElementById("p-db").innerHTML = `<span class="err">${esc(d.error || "error")}</span>`;
        return;
      }
      AGENTS = d.agents;
      assign();
      document.getElementById("n-all").textContent = d.count;
      document.getElementById("n-work").textContent = d.working;
      document.getElementById("n-tick").textContent = new Date().toLocaleTimeString();
      document.getElementById("p-db").textContent = "state.db ok";
      renderRoster();
    } catch (e) {
      document.getElementById("p-db").innerHTML = `<span class="err">server offline</span>`;
    }
  }

  function animate() { render(); requestAnimationFrame(animate); }

  animate();
  tick();
  setInterval(tick, 3000);
})();
</script>
</body>
</html>
